<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SCB Home Loan</title>
<style>
  :root {
    --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: #e1e0d9;
    --s1: #2a78d6; --s2: #eb6834; --s3: #8a5cd6; --good: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: #2c2c2a;
      --s1: #3987e5; --s2: #d95926; --s3: #9a72e8; --good: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--plane); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Sukhumvit Set", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--ink-2); margin: 4px 0 24px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .meter { height: 6px; background: var(--grid); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--s1); }
  .paid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 16px; padding: 20px; }
  .paid .item { border-left: 4px solid; padding-left: 14px; }
  .paid .label { color: var(--ink-2); font-size: 13px; }
  .paid .value { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .paid .note { color: var(--muted); font-size: 12px; }
  .split { grid-column: 1 / -1; display: flex; gap: 2px; height: 10px; }
  .split > div { border-radius: 3px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 12px; margin-bottom: 16px; }
  h2 { font-size: 14px; margin: 0 0 2px; }
  .chart-sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hit { fill: transparent; cursor: default; }
  #tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
         display: none; font-variant-numeric: tabular-nums; z-index: 10; }
  #tip b { display: block; margin-bottom: 4px; }
  #tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  .table-wrap { overflow-x: auto; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 24px; color: var(--ink-2); }
  .facts b { color: var(--ink); font-weight: 500; }
  .err { color: #e34948; }
  @media (max-width: 600px) {
    main { padding: 20px 12px 32px; }
    .paid { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
    .paid .value { font-size: 28px; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .tile .value { font-size: 20px; }
    /* Charts scale down with the viewBox, so bump label size to stay readable. */
    svg text { font-size: 15px; }
  }
</style>
</head>
<body>
<main>
  <h1>SCB Home Loan</h1>
  <div class="sub" id="sub"></div>
  <section class="card paid" id="paid"></section>
  <section class="tiles" id="tiles"></section>
  <section class="charts">
    <div class="card">
      <h2>Monthly payment split</h2>
      <div class="chart-sub">Baht per month, all receipts summed</div>
      <div class="legend"><span><i style="background:var(--s1)"></i>Principal</span><span><i style="background:var(--s2)"></i>Interest</span><span id="legend-other" hidden><i style="background:var(--s3)"></i>Other</span></div>
      <svg id="bars" role="img"></svg>
    </div>
    <div class="card">
      <h2>Outstanding balance</h2>
      <div class="chart-sub">Principal left after each payment</div>
      <svg id="line" role="img"></svg>
    </div>
  </section>
  <section class="card" style="margin-bottom:16px">
    <h2 style="margin-bottom:10px">Contract</h2>
    <div class="facts" id="facts"></div>
  </section>
  <section class="card">
    <h2 style="margin-bottom:10px">All receipts</h2>
    <div class="table-wrap"><table id="table"></table></div>
  </section>
</main>
<div id="tip"></div>
<script>
const thb = (n, d = 0) => "฿" + n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDate = (d, opts = { day: "numeric", month: "short", year: "numeric" }) => new Date(d).toLocaleDateString("en-GB", opts);
const monthLabel = m => fmtDate(m + "-01", { month: "short", year: "numeric" });
const shortMonth = m => fmtDate(m + "-01", { month: "short", year: "2-digit" });
const addMonths = (date, n) => { const d = new Date(date); d.setMonth(d.getMonth() + n); return d; };
// Whole months from a to b; both are "YYYY-MM..." strings.
const monthsBetween = (a, b) => (b.slice(0, 4) - a.slice(0, 4)) * 12 + (b.slice(5, 7) - a.slice(5, 7));
// Label every k-th x tick counting back from the newest, so about 6 labels fit and the last is always shown.
const showLabel = (i, n) => (n - 1 - i) % Math.ceil(n / 6) === 0;
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const tip = document.getElementById("tip");
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(evt.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = Math.min(evt.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => tip.style.display = "none";
// Mouse hover shows the tip; on touch a tap shows it and the next tap elsewhere or a scroll hides it.
function hover(hit, html) {
  for (const t of ["pointermove", "pointerdown"]) hit.addEventListener(t, e => showTip(e, html));
  hit.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });
}
document.addEventListener("pointerdown", e => { if (!e.target.closest(".hit")) hideTip(); });
addEventListener("scroll", hideTip, { passive: true });

// Months to clear `balance` paying `payment` monthly at `ratePct` annual. Infinity if it never clears.
function monthsToPayoff(balance, payment, ratePct) {
  const r = ratePct / 100 / 12;
  if (payment <= balance * r) return Infinity;
  return Math.ceil(-Math.log(1 - r * balance / payment) / Math.log(1 + r));
}

// Round [lo, hi] out to a 1/2/2.5/5 x 10^k step that gives about 4 ticks.
function niceDomain(lo, hi) {
  const raw = (hi - lo || hi) / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * p).find(s => s >= raw);
  return { min: Math.floor(lo / step) * step, max: Math.ceil(hi / step) * step, step };
}

function axes(svg, W, H, pad, { min, max, step }, fmt) {
  const n = Math.round((max - min) / step);
  for (let i = 0; i <= n; i++) {
    const v = min + step * i, y = H - pad.b - (H - pad.t - pad.b) * i / n;
    el("line", { x1: pad.l, x2: W - pad.r, y1: y, y2: y, stroke: i ? "var(--grid)" : "var(--axis)" }, svg);
    el("text", { x: pad.l - 6, y: y + 4, "text-anchor": "end" }, svg).textContent = fmt(v);
  }
}

function drawBars(rows) {
  const svg = document.getElementById("bars"), W = 480, H = 240, pad = { t: 10, r: 10, b: 26, l: 56 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const last = rows[rows.length - 1];
  svg.setAttribute("aria-label", `Monthly payments over ${rows.length} month(s); ${monthLabel(last.month)}: ${thb(last.paid)}`);
  const d = niceDomain(0, Math.max(...rows.map(r => r.paid)));
  axes(svg, W, H, pad, d, v => (v / 1000) + "k");
  const plotW = W - pad.l - pad.r, slot = plotW / Math.max(rows.length, 6), bw = Math.min(slot * 0.6, 36);
  const y = v => (H - pad.t - pad.b) * v / d.max;
  const parts = [["principal", "Principal", "var(--s1)"], ["interest", "Interest", "var(--s2)"], ["other", "Other", "var(--s3)"]];
  rows.forEach((r, i) => {
    const x = pad.l + slot * i + (slot - bw) / 2;
    let top = H - pad.b;
    parts.forEach(([k, , fill], j) => {
      if (!r[k]) return;
      top -= y(r[k]);
      el("rect", { x, y: top, width: bw, height: y(r[k]), fill, ...(j && { stroke: "var(--surface)", "stroke-width": 1 }) }, svg);
    });
    if (showLabel(i, rows.length))
      el("text", { x: x + bw / 2, y: H - 8, "text-anchor": "middle" }, svg).textContent = shortMonth(r.month);
    const hit = el("rect", { x: pad.l + slot * i, y: pad.t, width: slot, height: H - pad.t - pad.b, class: "hit" }, svg);
    hover(hit, `<b>${monthLabel(r.month)}</b>` +
      parts.filter(([k]) => k !== "other" || r.other).map(([k, l, c]) => `<i style="background:${c}"></i>${l} ${thb(r[k], 2)}<br>`).join("") +
      `Total ${thb(r.paid, 2)}`);
  });
}

function drawLine(rows, start) {
  const svg = document.getElementById("line"), W = 480, H = 240, pad = { t: 10, r: 14, b: 26, l: 56 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const pts = [{ month: "start", label: "Loan start", balance: start }, ...rows.map(r => ({ ...r, label: monthLabel(r.month) }))];
  svg.setAttribute("aria-label", `Outstanding balance from ${thb(start)} down to ${thb(pts[pts.length - 1].balance)}`);
  // Not zero-based: early on the drop is tiny next to the loan, so the axis zooms in on the range actually covered.
  const d = niceDomain(Math.min(...pts.map(p => p.balance)), start);
  axes(svg, W, H, pad, d, v => +(v / 1e6).toFixed(4) + "M");
  const plotW = W - pad.l - pad.r, step = plotW / Math.max(pts.length - 1, 6);
  const xy = (p, i) => [pad.l + step * i, H - pad.b - (H - pad.t - pad.b) * (p.balance - d.min) / (d.max - d.min)];
  el("polyline", { points: pts.map((p, i) => xy(p, i).join(",")).join(" "), fill: "none", stroke: "var(--s1)", "stroke-width": 2 }, svg);
  pts.forEach((p, i) => {
    const [x, yv] = xy(p, i);
    if (pts.length <= 24 || i === pts.length - 1)
      el("circle", { cx: x, cy: yv, r: 3.5, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
    if (showLabel(i, pts.length))
      el("text", { x, y: H - 8, "text-anchor": "middle" }, svg).textContent = i ? shortMonth(p.month) : "Start";
    const hit = el("rect", { x: x - step / 2, y: pad.t, width: step, height: H - pad.t - pad.b, class: "hit" }, svg);
    hover(hit, `<b>${p.label}</b>Balance ${thb(p.balance, 2)}`);
  });
}

// SCB can issue several receipts in one month; sum the amounts, keep the last balance and rate.
function byMonth(rows) {
  const months = {};
  for (const r of rows) {
    const m = months[r.month] ??= { month: r.month, paid: 0, principal: 0, interest: 0, other: 0 };
    for (const k of ["paid", "principal", "interest", "other"]) m[k] += r[k];
    Object.assign(m, { date: r.date, balance: r.balance, rate: r.rate });
  }
  return Object.values(months);
}

function render({ contract: c, receipts }) {
  const rows = byMonth(receipts);
  const last = rows[rows.length - 1];
  const sum = k => rows.reduce((s, r) => s + r[k], 0);
  const paidOff = c.loan_total - last.balance;
  const months = monthsToPayoff(last.balance, last.paid, last.rate);
  const payoff = addMonths(last.date, months);
  const contractEnd = addMonths(c.signed, c.term_years * 12);
  // Installment #1 is the month after signing; the required amount steps up by installment number.
  const installment = monthsBetween(c.signed, last.month);
  const required = (c.required_installments.find(t => t.from <= installment && (t.to == null || installment <= t.to))
    ?? c.required_installments[0]).amount;
  const extra = last.paid - required;
  const fixedLeft = monthsBetween(new Date().toISOString(), c.fixed_until);

  document.getElementById("sub").textContent =
    `Account ${c.account} · ${receipts.length} receipt${receipts.length > 1 ? "s" : ""} · latest ${fmtDate(last.date)}`;

  const principal = sum("principal"), interest = sum("interest"), share = v => (v / (principal + interest) * 100).toFixed(1);
  document.getElementById("paid").innerHTML = [
    ["var(--s1)", "เงินต้นที่จ่ายไปแล้ว · Principal paid", principal, `${share(principal)}% of payments · ${(principal / c.loan_total * 100).toFixed(2)}% of the loan`],
    ["var(--s2)", "ดอกเบี้ยที่จ่ายไปแล้ว · Interest paid", interest, `${share(interest)}% of payments`],
  ].map(([color, l, v, n]) => `<div class="item" style="border-color:${color}">
      <div class="label">${l}</div><div class="value">${thb(v, 2)}</div><div class="note">${n}</div></div>`).join("") +
    `<div class="split" title="Principal ${share(principal)}% · Interest ${share(interest)}%">
      <div style="flex:${principal};background:var(--s1)"></div><div style="flex:${interest};background:var(--s2)"></div></div>`;

  const tiles = [
    ["Outstanding balance", thb(last.balance),
      `${thb(paidOff)} paid off · ${(paidOff / c.loan_total * 100).toFixed(2)}% of ${thb(c.loan_total)}`, paidOff / c.loan_total],
    ["Total paid", thb(sum("paid")), `${thb(sum("interest"), 2)} of it interest`],
    [`Paid in ${monthLabel(last.month)}`, thb(last.paid),
      `installment #${installment} · required ${thb(required)} · ${extra >= 0 ? "extra " + thb(extra) : "short " + thb(-extra)}`],
    isFinite(months)
      ? ["Payoff at this pace", fmtDate(payoff, { month: "short", year: "numeric" }),
          `~${(months / 12).toFixed(1)} yrs vs contract ${contractEnd.getFullYear()} · assumes ${thb(last.paid)}/mo and ${last.rate}% for the whole term`]
      : ["Payoff at this pace", "—", `${thb(last.paid)}/mo does not cover the interest at ${last.rate}%`],
    ["Fixed rate until", fmtDate(c.fixed_until, { month: "short", year: "numeric" }),
      fixedLeft > 0 ? `${c.fixed_rate}% for ${fixedLeft} more months, then ${c.rate_after}` : `now ${c.rate_after}`],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([l, v, n, m]) => `
    <div class="card tile"><div class="label">${l}</div><div class="value">${v}</div><div class="note">${n}</div>
    ${m !== undefined ? `<div class="meter"><div style="width:${Math.max(m * 100, 0.5)}%"></div></div>` : ""}</div>`).join("");

  document.getElementById("facts").innerHTML = [
    ["Signed", fmtDate(c.signed)],
    ["Loan", `${thb(c.loan_total)} (home ${thb(c.loan_home)} + fire insurance ${thb(c.loan_fire_insurance)})`],
    ["Term", `${c.term_years} years`],
    ["Rate", `${c.fixed_rate}% fixed until ${fmtDate(c.fixed_until, { month: "short", year: "numeric" })}, then ${c.rate_after}`],
    ["Required installment", c.required_installments.map(i => `${thb(i.amount)} (#${i.from}${i.to ? "–" + i.to : "+"})`).join(", ")],
  ].map(([k, v]) => `<div>${k}: <b>${v}</b></div>`).join("");

  // Fees and insurance have been zero so far; only show the Other column once one turns up.
  const hasOther = receipts.some(r => r.other);
  document.getElementById("legend-other").hidden = !hasOther;
  document.getElementById("table").innerHTML =
    `<tr><th>Date</th><th>Receipt no.</th><th>Paid</th><th>Principal</th><th>Interest</th>${hasOther ? "<th>Other</th>" : ""}<th>Balance</th><th>Rate</th></tr>` +
    [...receipts].reverse().map(r => `<tr><td>${fmtDate(r.date)}</td><td>${r.no}</td><td>${thb(r.paid, 2)}</td>
      <td>${thb(r.principal, 2)}</td><td>${thb(r.interest, 2)}</td>${hasOther ? `<td>${thb(r.other, 2)}</td>` : ""}
      <td>${thb(r.balance, 2)}</td><td>${r.rate}%</td></tr>`).join("");

  drawBars(rows);
  drawLine(rows, c.loan_total);
}

fetch("data.json").then(r => r.json()).then(render).catch(e => {
  document.getElementById("sub").innerHTML = `<span class="err">Could not load data.json. Run <code>.venv/bin/python extract.py</code> and serve with <code>python3 -m http.server</code>. (${e.message})</span>`;
});
</script>
</body>
</html>
